<style>
:root{--bg:#F6F8F9;--card:#fff;--ink:#16202B;--muted:#55616E;--indigo:#1E3157;--on:#EEF2F7;--pine:#3F6040;--line:#D3DAE0;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1621;--card:#16202E;--ink:#E6EBF0;--muted:#9AA7B4;--indigo:#223A68;--pine:#9DBB8F;--line:#2A3646}}
:root[data-theme="dark"]{--bg:#0F1621;--card:#16202E;--ink:#E6EBF0;--muted:#9AA7B4;--indigo:#223A68;--pine:#9DBB8F;--line:#2A3646}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Zen Kaku Gothic New",system-ui,sans-serif}
h1,h2,h3{font-family:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;line-height:1.25;margin:0}
a{color:inherit}a:focus-visible{outline:3px solid var(--pine);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:12px;padding-bottom:12px}
.logo{font:700 1.3rem "Shippori Mincho",Georgia,serif;text-decoration:none}
nav a{margin-left:18px;text-decoration:none;color:var(--muted)}nav a:hover{color:var(--ink)}
.hero{background:var(--indigo);color:var(--on);padding:64px 0;position:relative}.hero .wrap{position:relative}.hero>svg{position:absolute;right:0;bottom:0;height:100%;width:min(55%,560px)}@media (max-width:700px){.hero>svg{opacity:.25}}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);max-width:17ch}
.hero p{max-width:54ch;margin:16px 0 0;opacity:.9}
section{padding:40px 0}
h2{font-size:1.65rem;margin-bottom:6px}.sub{color:var(--muted);margin:0 0 22px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.facts b{display:block;font:700 1.3rem "Shippori Mincho",Georgia,serif}
.facts span{color:var(--muted);font-size:.9rem}
.ph{margin:0;position:relative;overflow:hidden;border-radius:6px;min-height:170px;display:flex;align-items:flex-end;color:#fff;
 background:linear-gradient(135deg,hsl(var(--h) 40% 36%),hsl(calc(var(--h) + 35) 45% 22%))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92);transition:transform .25s ease}.ph svg{position:absolute;inset:0;width:100%;height:100%}.ph:hover img{transform:scale(1.03)}.ph span{position:relative;padding:10px 12px;font-size:.85rem;background:linear-gradient(transparent,rgba(0,0,0,.55));width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.quick-card{display:block;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:8px;text-decoration:none}.quick-card strong{display:block;font:700 1.15rem "Shippori Mincho",Georgia,serif}.quick-card span{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}.section-head .sub{margin:0}.city-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.city-action{display:block;padding:14px 12px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:8px;text-decoration:none}.city-action strong{display:block}.city-action span{font-size:.82rem;color:var(--muted)}@media(max-width:700px){.city-actions{grid-template-columns:repeat(2,1fr)}}
.card{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:block}
.card:hover{border-color:var(--pine)}.card .ph{border-radius:0;min-height:140px}
.card div{padding:14px 16px}.card h3{font-size:1.2rem}.card p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.page h1{font-size:clamp(1.9rem,5vw,2.8rem);padding-top:36px}.page .lead{max-width:64ch;margin:10px 0 0}
.crumb{display:inline-block;margin-top:26px;color:var(--muted);text-decoration:none}
.tl{display:grid;grid-template-columns:150px 1fr;gap:4px 24px;padding:18px 0;border-top:1px solid var(--line)}
.tl b{font:700 1.1rem "Shippori Mincho",Georgia,serif}.tl h3{font-size:1.1rem;margin-bottom:2px}.tl p{margin:0;max-width:62ch}
.item{padding:20px 0;border-top:1px solid var(--line)}.item h3{font-size:1.2rem;margin-bottom:4px}.item p{margin:0;max-width:64ch}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.gallery .ph:first-child{grid-row:span 2;min-height:280px}
.place{display:grid;grid-template-columns:240px 1fr;gap:8px 24px;padding:18px 0;border-top:1px solid var(--line)}
.place h3{font-size:1.15rem;margin-bottom:4px}.place p{margin:0;max-width:60ch}
@media (max-width:700px){.gallery,.place,.tl{grid-template-columns:1fr}.gallery .ph:first-child{grid-row:auto;min-height:210px}}
.note{background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:12px 16px;color:var(--muted);font-size:.9rem;margin-top:24px}
.search{margin-top:22px;max-width:520px;position:relative}.search input{width:100%;padding:14px 18px;font:inherit;border-radius:999px;border:0;color:#16202B;background:#fff}
.res{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:6}
.res a{display:block;padding:10px 16px;text-decoration:none}.res a[href]:hover{background:var(--bg)}.res small{color:var(--muted);margin-left:6px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:24px 0 8px;overflow-x:auto}
.tabbtn{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabbtn[aria-selected=true]{color:var(--ink);border-color:var(--pine);font-weight:500}.tab[hidden]{display:none}
.rate{display:flex;align-items:center;gap:5px;margin-top:8px;color:var(--muted);font-size:.85rem}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--pine);background:none;padding:0;cursor:pointer}.dot.on{background:var(--pine)}
button:focus-visible{outline:3px solid var(--pine);outline-offset:2px}

.filter-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}.pill{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none}.pill:hover,.pill:focus-visible{border-color:var(--ink);background:var(--bg)}.item-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}

/* Michi local map: no embedded map, external tile server, or third-party map script required */
.michi-local-map{background:#f4f0e5;color:#26352b;padding:12px;border:1px solid #d8cfb9;min-height:320px}
.michi-local-map-label{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:'Zen Old Mincho',serif;font-weight:700;padding:4px 4px 10px}
.michi-local-map-label small{font:600 .68rem system-ui,sans-serif;letter-spacing:.14em;color:#657263}
.michi-local-map-canvas{height:300px;position:relative;overflow:hidden;background-color:#eee8d8;background-image:linear-gradient(28deg,transparent 47%,rgba(176,151,112,.42) 48%,rgba(176,151,112,.42) 49%,transparent 50%),linear-gradient(115deg,transparent 43%,rgba(176,151,112,.38) 44%,rgba(176,151,112,.38) 45%,transparent 46%),repeating-linear-gradient(0deg,transparent 0 37px,rgba(153,143,118,.22) 38px 40px),repeating-linear-gradient(90deg,transparent 0 48px,rgba(153,143,118,.2) 49px 51px);border:1px solid #d7ceb8;border-radius:2px}
.michi-map-river{position:absolute;left:36%;top:-18%;height:140%;width:9%;background:#b8d7d6;opacity:.85;transform:rotate(24deg);border-radius:50%;filter:blur(1px)}
.michi-map-park{position:absolute;background:#d4dfc4;border:1px solid #c2d0b1;border-radius:35% 45% 38% 50%;opacity:.9}.michi-map-park.park-a{left:8%;top:17%;width:18%;height:23%;transform:rotate(-12deg)}.michi-map-park.park-b{right:9%;bottom:13%;width:20%;height:22%;transform:rotate(14deg)}
.michi-local-pin{position:absolute;transform:translate(-50%,-50%);z-index:2;text-decoration:none;display:flex;align-items:center;gap:4px;max-width:45%;color:#26352b}.michi-local-pin span{display:grid;place-items:center;flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#a83d30;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px #6b6556;font:700 11px system-ui,sans-serif}.michi-local-pin.food span{background:#2e6f55}.michi-local-pin b{font:600 10px/1.15 system-ui,sans-serif;background:rgba(255,252,244,.92);padding:3px 5px;border-radius:2px;box-shadow:0 1px 2px #c4baa4;max-width:120px}.michi-local-pin:hover{z-index:5;transform:translate(-50%,-50%) scale(1.06)}.michi-map-disclaimer{font-size:.82rem;color:#5b665a;margin:9px 2px 12px;line-height:1.5}

.michi-map-loading,.michi-map-failed{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;padding:24px;background:#f4f0e5;color:#26352b}.michi-map-loading p,.michi-map-failed p{margin:0;max-width:48ch}.michi-map-failed a{color:#8f382d;font-weight:700}.michi-tile-note{position:absolute;z-index:900;bottom:8px;left:8px;right:8px;padding:8px 10px;background:#fffaf0eF;color:#493f30;font-size:.8rem;box-shadow:0 1px 5px #5555}.michi-map-guide{margin:14px 0 24px;padding:18px;background:#f4f0e5;border:1px solid #d8cfb9;color:#26352b}.michi-guide-head{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap;margin-bottom:14px}.michi-guide-head h3{font-size:1.35rem}.michi-guide-head p{margin:5px 0 0;max-width:56ch;font-size:.9rem}.michi-route-mode{display:grid;gap:5px;font-size:.85rem;font-weight:700}.michi-route-mode select{padding:9px;min-height:42px;border:1px solid #c4b89f;background:#fffaf0;color:#26352b;font:inherit;max-width:100%}.michi-guide-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:8px}.michi-guide-place{display:flex;gap:10px;padding:12px;background:#fffaf0;border-left:3px solid #a83d30}.michi-guide-number{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:50%;background:#a83d30;color:white;font:700 .85rem system-ui}.michi-guide-copy{min-width:0}.michi-guide-copy strong,.michi-guide-copy small{display:block}.michi-guide-copy small{color:#5d665c;font-size:.8rem}.michi-guide-actions{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;font-size:.82rem}.michi-guide-actions a{color:#8f382d;font-weight:700}.michi-map-disclaimer{margin:12px 0 0;font-size:.8rem;color:#596253;line-height:1.5}.leaflet-popup-content{line-height:1.6}.leaflet-popup-content a{display:inline-block;margin-top:4px}
@media(max-width:600px){.michi-local-map{padding:8px}.michi-local-map-canvas{height:260px}.michi-local-pin b{max-width:88px;font-size:9px}.michi-local-pin span{width:22px;height:22px;flex-basis:22px}}


/* Booking workflow additions */
.stay-search-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:18px;background:var(--card);border:1px solid var(--line)}
.stay-search-grid label,.booking-form label{display:grid;gap:6px;font-weight:700}.stay-search-grid input,.stay-search-grid select,.booking-form input,.booking-form select,.booking-form textarea{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.stay-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}.stay-result{padding:17px;background:var(--card);border:1px solid var(--line)}.stay-result h3{margin-top:0}.stay-result .stay-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.booking-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px;background:var(--card);border:1px solid var(--line)}.booking-form .full{grid-column:1/-1}.booking-records{display:grid;gap:10px;margin-top:14px}.booking-record{padding:15px;border:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.booking-record h3{margin:0 0 5px}.booking-record p{margin:3px 0}.booking-record .mini-btn{white-space:nowrap}.saved-plan-btn{margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 9px;font:inherit;font-size:.85rem;cursor:pointer}.planner-connection-note{margin-top:12px;padding:12px 14px;background:var(--card);border-left:4px solid var(--pine)}
@media(max-width:600px){.booking-form{grid-template-columns:1fr}.booking-form .full{grid-column:auto}.booking-record{flex-direction:column}}

.ai-sources{margin-top:12px;padding-top:9px;border-top:1px solid var(--line,#ddd);font-size:.88rem}.ai-sources strong{display:block;margin-bottom:5px}.ai-sources ul{margin:0;padding-left:18px}.ai-sources li{margin:4px 0}.ai-sources a{overflow-wrap:anywhere}</style><style>
.place>a{display:block}.place h3 a{text-decoration:none}.place h3 a:hover{text-decoration:underline;color:var(--pine)}
a.item{display:block;text-decoration:none}a.item:hover h3{color:var(--pine)}
.big{min-height:260px;margin-bottom:8px}
</style><style>
.gallery>a{display:block}.gallery>a .ph:first-child{min-height:170px;height:100%;grid-row:auto}
.gallery>a:first-child{grid-row:span 2}.gallery>a:first-child .ph:first-child{min-height:280px}
.gallery>a:hover .ph span{text-decoration:underline}
@media (max-width:700px){.gallery>a:first-child{grid-row:auto}.gallery>a:first-child .ph:first-child{min-height:210px}}
</style><style>.page p a{color:var(--pine);text-decoration:underline}</style><style>footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.9rem;margin-top:24px}
</style>
<style>
:root{--bg:#F3EEE2;--card:#FAF6EC;--ink:#1E1B16;--muted:#6A6256;--indigo:#24314F;--on:#F3EEE2;--pine:#B3382B;--line:#D3C8AF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161A;--card:#1E2025;--ink:#ECE6D8;--muted:#A8A092;--indigo:#27375B;--pine:#E27563;--line:#3A3A40}}
:root[data-theme="dark"]{--bg:#15161A;--card:#1E2025;--ink:#ECE6D8;--muted:#A8A092;--indigo:#27375B;--pine:#E27563;--line:#3A3A40}
body{font-family:"Zen Old Mincho","Hiragino Mincho ProN",Georgia,serif;letter-spacing:.02em;background-image:radial-gradient(rgba(90,60,20,.06) 1px,transparent 1px);background-size:5px 5px}

 background-color:var(--indigo);
 background-image:radial-gradient(circle at 50% 100%,transparent 28%,rgba(255,255,255,.1) 29% 31%,transparent 32% 48%,rgba(255,255,255,.1) 49% 51%,transparent 52%),radial-gradient(circle at 50% 100%,transparent 28%,rgba(255,255,255,.1) 29% 31%,transparent 32% 48%,rgba(255,255,255,.1) 49% 51%,transparent 52%);
 background-size:56px 28px;background-position:0 0,28px 14px}
.hero h1{letter-spacing:.06em}
.facts li,.card,.note,.search input{border-radius:0;border-color:var(--ink)}
.card:hover{border-color:var(--pine)}

.seal{display:inline-block;writing-mode:vertical-rl;background:var(--pine);color:#fff;font-size:.45em;line-height:1;padding:.5em .35em;margin-left:.4em;vertical-align:middle;border-radius:2px;letter-spacing:.1em}
.item h3 small,.place h3 small{font-size:.8rem;color:var(--pine);font-weight:500;margin-left:6px}

/* Accessibility and ease-of-use improvements */
.skip-link{position:fixed;left:16px;top:-60px;z-index:20;background:var(--ink);color:var(--card);padding:10px 16px;text-decoration:none;border:2px solid var(--pine);font-weight:700}
.skip-link:focus{top:12px}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{display:inline-block;padding:10px 8px;margin-left:0}
button,.dot{min-width:44px;min-height:44px}
.search input{min-height:48px}
.res a{min-height:44px;display:flex;align-items:center;gap:4px}
.res a[aria-disabled="true"]{cursor:default;color:var(--muted)}
.tabbtn{min-height:48px}
:focus-visible{outline:3px solid var(--pine);outline-offset:3px}
@media (max-width:700px){
  .wrap{padding-left:16px;padding-right:16px}
  .bar .wrap{align-items:flex-start}
  nav{width:100%;justify-content:space-between}
  nav a{flex:1;text-align:center}

  .tl{gap:0 14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.map-section{padding:20px 0 28px}.map-wrap{position:relative;border:2px solid var(--ink);background:var(--card)}.city-map{height:430px;min-height:320px;width:100%;z-index:1}.map-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px}.map-tools p{margin:0;color:var(--muted);font-size:.9rem}.map-reset{border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 12px;min-height:44px;cursor:pointer;font:inherit}.map-reset:hover{background:var(--bg)}.map-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;color:var(--muted);font-size:.85rem}.map-key{display:inline-flex;align-items:center;gap:6px}.map-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid currentColor}.map-dot.landmark{color:#B3382B;background:#B3382B}.map-dot.food{color:#2E6F55;background:#2E6F55}.leaflet-container{font:14px/1.4 system-ui,sans-serif;background:#e8e3d8}.leaflet-div-icon.michi-div-icon{background:transparent;border:0}.michi-map-pin{display:block;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px #17211b88;position:relative}.michi-map-pin::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}.michi-map-pin.place{background:#B3382B}.michi-map-pin.food{background:#2E6F55}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}.leaflet-popup-content a{color:var(--pine)}.map-empty{padding:18px;background:var(--card);border:1px solid var(--line)}

/* Performance + planner UI */
.ph img{decoding:async}

 <div class="wrap"><section class="home-explore"><div class="section-head"><div><p class="eyebrow">DISCOVER JAPAN</p><h2>Start exploring</h2><p class="sub">Start with the things you want to see, taste and experience.</p></div></div><div class="explore-primary"><a class="explore-card explore-cities" href="#/cities"><span class="explore-icon" aria-hidden="true">🗾</span><span class="explore-copy"><strong>Cities</strong><span>Find your base — from Tokyo and Kyoto to smaller destinations.</span></span><span class="explore-arrow" aria-hidden="true">↗</span></a><a class="explore-card explore-places" href="#/places"><span class="explore-icon" aria-hidden="true">⛩</span><span class="explore-copy"><strong>Places</strong><span>Explore temples, landmarks, gardens, markets and hidden gems.</span></span><span class="explore-arrow" aria-hidden="true">↗</span></a><a class="explore-card explore-food" href="#/food"><span class="explore-icon" aria-hidden="true">🍜</span><span class="explore-copy"><strong>Food</strong><span>Discover regional dishes and find places to eat.</span></span><span class="explore-arrow" aria-hidden="true">↗</span></a></div><div class="home-tools-head"><div><h3>Plan and prepare</h3><p class="sub">Practical tools for the rest of your trip.</p></div></div><div class="home-tools-grid"><a class="quick-card" href="#/myjapan"><strong>♡ My Japan</strong><span>Save places, organise days and track your plans.</span></a><a class="quick-card" href="#/stay-compare"><strong>🛏 Compare accommodation</strong><span>Compare areas, stay styles and nightly budgets.</span></a><a class="quick-card" href="#/essentials"><strong>✓ Trip checklist</strong><span>Keep preparation and arrival tasks on track.</span></a><a class="quick-card" href="#/phrasebook"><strong>あ Phrasebook</strong><span>Keep useful Japanese phrases close at hand.</span></a><a class="quick-card" href="#/rail-pass"><strong>🚄 Rail pass guide</strong><span>Compare travel patterns before buying tickets.</span></a><a class="quick-card" href="#/history"><strong>⛩ History & culture</strong><span>Understand the places and customs you encounter.</span></a><a class="quick-card" href="#/safety"><strong>＋ Safety & emergencies</strong><span>Save essential information before departure.</span></a></div><div class="ai-hero"><div><p class="eyebrow">YOUR PERSONAL TRAVEL COMPANION</p><h2>Need help deciding?</h2><p>Chat with Michi AI for practical advice, honest trade-offs, restaurant ideas and a personalised itinerary.</p></div><div class="ai-actions"><a class="ai-cta" href="#/planner">Chat with Michi AI <span aria-hidden="true">→</span></a><button class="secondary-btn" type="button" id="install-app" hidden>Install app</button></div></div></section>
 <section><div class="section-head"><div><h2>Popular cities</h2><p class="sub">Open a city to see photos, places, food and planning info.</p></div><a class="crumb" href="#/cities">See all cities →</a></div>${cityCards()}</section>
 <section><h2>Japan at a glance</h2><p class="sub">Key facts</p>${facts(JAPAN)}</section></div>`}),
history:()=>({t:'History',h:`<div class="wrap page">${head('History of Japan','Key periods from prehistory to the present.')}<section>${HIST.map(x=>`<div class="tl"><b>${x[0]}</b><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</section></div>`}),
culture:()=>({t:'Culture',h:`<div class="wrap page">${head('Japanese culture','Language, belief, food, arts and society.')}<section>${CULT.map(x=>`<div class="item"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</section></div>`}),
places:()=>({t:'Places in Japan',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><h1>Places in Japan</h1><p class="lead">Browse landmarks, temples, markets, gardens and other places by city.</p><div class="filter-pills" aria-label="Filter places by city">${CITIES.map(c=>`<a class="pill" href="#/${c.id}">${c.name}</a>`).join('')}</div>${CITIES.map(c=>`<section><div class="section-head"><div><h2>${c.name}</h2><p class="sub">${c.places.length} places</p></div><a class="crumb" href="#/${c.id}/skyline">See ${c.name} →</a></div><div class="grid">${c.places.map((p,i)=>`<a class="card" href="#/${c.id}/${i}">${ph(p[0],c.hue+i*15,pick(p[0]),photoForPlace(c.id,p[0]))}<div><h3>${p[0]}</h3><p>${p[1]}</p></div></a>`).join('')}</div></section>`).join('')}</div>`}),
food:()=>({t:'Food in Japan',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><h1>Food in Japan</h1><p class="lead">Find dishes and places to eat, organised by city.</p><div class="filter-pills" aria-label="Filter food by city">${CITIES.map(c=>`<a class="pill" href="#/${c.id}/food">${c.name}</a>`).join('')}</div>${CITIES.map(c=>{const x=X[c.id];return `<section><div class="section-head"><div><h2>${c.name}</h2><p class="sub">Dishes and places to eat</p></div><a class="crumb" href="#/${c.id}/food">See ${c.name} food →</a></div><div class="grid">${x.food.map((f,i)=>`<a class="card" href="#/${c.id}/food/${foodSlug(f[0])}">${ph(f[0],c.hue+i*12,'bowl',foodPhoto(c.id,f[0],'dish'))}<div><h3>${f[0]}</h3><p>${f[1]}</p><small>See recommended places →</small></div></a>`).join('')}</div><div class="item-list">${(SP[c.id]||[]).map((f,i)=>`<a class="item" href="#/${c.id}/eat/${i}"><h3>${f[0]}<small>${f[1]}</small></h3><p>${f[2]}</p></a>`).join('')}</div></section>`}).join('')}</div>`}),
explore:()=>({t:'Explore Japan',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><h1>Explore Japan</h1><p class="lead">Everything is grouped by the way you are most likely to look for it: city, place or food.</p><section><h2>By city</h2><p class="sub">Start with a destination.</p>${cityCards()}</section><section><h2>By interest</h2><div class="quick-grid"><a class="quick-card" href="#/tokyo/skyline"><strong>City views</strong><span>Skylines, towers and viewpoints</span></a><a class="quick-card" href="#/kyoto/street"><strong>Streets & districts</strong><span>Markets, neighbourhoods and walks</span></a><a class="quick-card" href="#/kyoto/food"><strong>Food</strong><span>What to eat and where to try it</span></a><a class="quick-card" href="#/culture"><strong>Culture</strong><span>Language, religion, arts and festivals</span></a><a class="quick-card" href="#/tools"><strong>Trip tools</strong><span>Transport, seasons, budgets and stay length</span></a></div></section></div>`}),
start:()=>({t:'Start planning your first Japan trip',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><div class="start-shell"><h1>Build a sensible first trip</h1><p class="lead">Tell Michi roughly what you want. We’ll give you a starting route — not a rigid schedule.</p><div class="start-step"><h2>How long?</h2><div class="choice-grid">${[5,7,10,14].map(n=>`<label><input type="radio" name="start-days" value="${n}" ${n===7?'checked':''}><span>${n} days</span></label>`).join('')}</div></div><div class="start-step"><h2>What matters most?</h2><div class="choice-grid">${[['culture','🏯 Culture'],['food','🍜 Food'],['cities','🌃 Cities'],['nature','🌿 Nature']].map((x,i)=>`<label><input type="checkbox" name="start-interest" value="${x[0]}" ${i<2?'checked':''}><span>${x[1]}</span></label>`).join('')}</div></div><div class="start-step"><h2>Your starting route</h2><p class="sub">We’ll keep the classic route compact unless your interests point elsewhere.</p><div id="start-route-preview" class="route-strip"></div></div><div class="start-actions"><button class="primary-btn" type="button" id="build-start-trip">Build my starter trip →</button><a class="secondary-btn" href="#/planner">Ask the AI instead</a></div></div></div>`}),
tools:()=>({t:'Trip tools',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><h1>Japan trip tools</h1><p class="lead">Practical tools for turning inspiration into a trip you can actually use.</p><div class="tool-grid"><a class="tool-card" href="#/myjapan"><h2>♡ My Japan</h2><p>Save places, organise them by day and keep your trip checklist.</p></a><a class="tool-card" href="#/transport"><h2>🚄 Transport</h2><p>Understand trains, IC cards, buses, taxis and airport transfers.</p></a><a class="tool-card" href="#/travel-guide"><h2>🧭 Complete travel guide</h2><p>Practical essentials from arrival and connectivity to money, safety and etiquette.</p></a><a class="tool-card" href="#/stay-guide"><h2>🛏 Accommodation guide</h2><p>Choose the right base, accommodation type and neighbourhood for each city.</p></a><a class="tool-card" href="#/stay-compare"><h2>Compare accommodation</h2><p>Compare stay styles, budget and neighbourhoods, then open booking searches.</p></a><a class="tool-card" href="#/seasons"><h2>🌸 Best time to visit</h2><p>Compare the seasons and choose based on weather, crowds and interests.</p></a><a class="tool-card" href="#/stay"><h2>⏱ How long should I stay?</h2><p>Get a sensible starting point for each city.</p></a><a class="tool-card" href="#/food-guide"><h2>🍜 Food guide</h2><p>Browse dishes by region and decide what is actually worth seeking out.</p></a><a class="tool-card" href="#/planner"><h2>✦ AI planner</h2><p>Ask for opinions, trade-offs and a realistic itinerary.</p></a><a class="tool-card" href="#/essentials"><h2>✓ Trip checklist</h2><p>Track preparation and arrival tasks on this device.</p></a><a class="tool-card" href="#/phrasebook"><h2>あ Phrasebook</h2><p>Copy practical Japanese phrases for everyday travel.</p></a><a class="tool-card" href="#/rail-pass"><h2>🚄 Rail pass guide</h2><p>Compare route patterns before buying rail passes.</p></a><a class="tool-card" href="#/safety"><h2>＋ Safety & emergencies</h2><p>Know the basics and save key information before you travel.</p></a></div><div class="offline-note"><strong>Offline tip:</strong> Save your important picks in My Japan before travelling. When the site is served as a PWA, the core app can also be cached for offline use.</div></div>`}),
transport:()=>({t:'Japan transport guide',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>Japan transport guide</h1><p class="lead">The simple version: use IC cards for local travel, trains for cities and Shinkansen for long distances.</p><div class="transport-grid"><article><h2>🚄 Shinkansen</h2><p>Best when the distance is long enough to justify paying for speed. Tokyo–Kyoto/Osaka is the classic use case.</p><p><strong>My take:</strong> buy the faster train when time matters; don't buy a nationwide pass automatically just because it sounds convenient.</p></article><article><h2>💳 IC cards</h2><p>Useful for everyday trains, subways, buses and many small purchases. Keep a backup payment method and some cash.</p></article><article><h2>🚇 Local trains & subway</h2><p>Usually the best way around Tokyo, Osaka, Kyoto and other large cities. Google Maps or another current routing app is useful for platform details.</p></article><article><h2>🚌 Buses</h2><p>Particularly important in Kyoto and smaller destinations. They can be slower at busy times, so leave buffer time.</p></article><article><h2>🚕 Taxis</h2><p>Useful for late nights, luggage-heavy days and awkward last-mile connections. They are rarely the cheapest default.</p></article><article><h2>✈️ Airports</h2><p>Check the actual airport before booking. Tokyo has Narita and Haneda; Osaka has Kansai and Itami serving different kinds of trips.</p></article></div><section><h2>Easy decision rule</h2><div class="opinion"><div class="opinion-badge">✦</div><div><strong>Spend money when it buys back meaningful time.</strong><p>If a cheaper route adds 90 minutes and a lot of hassle, the faster option can be worth it. If the difference is small, save the money for food or experiences.</p></div></div></section></div>`}),
seasons:()=>({t:'Best time to visit Japan',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>When should you visit Japan?</h1><p class="lead">There is no single best month. The right season depends on what you want more: blossoms, comfortable weather, festivals, snow or lower-pressure travel.</p><div class="season-grid"><button type="button" data-season-page="spring">🌸 Spring</button><button type="button" data-season-page="summer">☀️ Summer</button><button type="button" data-season-page="autumn">🍁 Autumn</button><button type="button" data-season-page="winter">❄️ Winter</button></div><div class="season-result" id="season-page-result">Choose a season above.</div><section><h2>My quick ranking</h2><div class="opinion"><div class="opinion-badge">1</div><div><strong>Autumn</strong><p>Excellent balance of comfortable weather, scenery and fewer weather-related compromises than summer.</p></div></div><div class="opinion"><div class="opinion-badge">2</div><div><strong>Spring</strong><p>Fantastic if cherry blossoms are a priority, but expect popular places to be crowded around peak dates.</p></div></div><div class="opinion"><div class="opinion-badge">3</div><div><strong>Winter</strong><p>Underrated for cities, onsens and snow trips. Northern Japan is a very different winter experience from Tokyo or Kyoto.</p></div></div><div class="opinion"><div class="opinion-badge">4</div><div><strong>Summer</strong><p>Worth it for festivals and northern travel, but heat, humidity and rain can make sightseeing harder.</p></div></div></section></div>`}),
stay:()=>({t:'How long should I stay?',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>How long should I stay?</h1><p class="lead">Use these as starting points, not rules. Longer trips are usually better spent adding depth rather than collecting more cities.</p><div class="stay-grid">${CITIES.map(c=>{const n=c.id==='tokyo'?'4–5 days':c.id==='kyoto'?'3–4 days':c.id==='osaka'?'2–3 days':c.id==='hiroshima'?'1–2 days':c.id==='nara'?'1 day':c.id==='sapporo'?'2–3 days':'2 days';return `<article class="stay-card"><h2>${c.name}</h2><strong>${n}</strong><span>Good first-trip range</span><p>${c.tag}</p><a class="crumb" href="#/${c.id}">Explore ${c.name} →</a></article>`}).join('')}</div><section><h2>My rule of thumb</h2><div class="opinion"><div class="opinion-badge">✦</div><div><strong>Don't change hotels every night.</strong><p>Every move costs packing time, check-in time and mental energy. If you only have a week, two bases is often more enjoyable than four.</p></div></div></section></div>`}),
'food-guide':()=>({t:'Japan food guide',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>Japan food guide</h1><p class="lead">Start with regional specialities, then choose restaurants around the places you are already visiting.</p>${CITIES.map(c=>{const x=X[c.id];return `<section><div class="section-head"><div><h2>${c.name}</h2><p class="sub">Regional picks</p></div><a class="crumb" href="#/${c.id}/food">Full food guide →</a></div><div class="grid">${x.food.map(f=>`<a class="card" href="#/${c.id}/food/${foodSlug(f[0])}"><div><h3>${f[0]}</h3><p>${f[1]}</p></div></a>`).join('')}</div></section>`}).join('')}<section><h2>My food advice</h2><div class="opinion"><div class="opinion-badge">🍜</div><div><strong>Don't optimise every meal.</strong><p>Pick one or two meals you care about each day. Leave the rest flexible so you can eat where you happen to be.</p></div></div></section></div>`}),
today:()=>({t:'Today mode',h:`<div class="wrap page"><a class="crumb" href="#/myjapan">← My Japan</a><div class="ai-hero"><div><h2>✦ Today mode</h2><p>Your travel-day view: see what is planned, what is next and what is still left to do.</p></div><span aria-hidden="true" style="font-size:2rem">🗾</span></div><div id="today-content"></div><div class="note">Tip: keep 2–3 main stops per day and leave room for meals, queues and wandering.</div></div>`}),
planner:()=>({t:'AI Trip Planner',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><div class="ai-hero" style="margin-top:8px"><div><h2>✦ Your Japan travel guide</h2><p>Ask me anything about your trip. I can give opinions, compare cities, suggest where to spend your time, help with food choices, and turn your ideas into a realistic itinerary.</p></div><span aria-hidden="true" style="font-size:2rem">🗾</span></div><h1>Chat with the AI Trip Planner</h1><p class="lead">Start with a question, not a form. The planner remembers the conversation so you can refine the trip as you go.</p><div class="planner-shell"><aside class="planner-profile" aria-label="Trip preferences"><h2>Trip basics</h2><p class="sub">Optional — these help the AI tailor its advice.</p><label for="chat-destination">Destination<select id="chat-destination"><option>Japan</option><option>Tokyo</option><option>Kyoto</option><option>Osaka</option><option>Hiroshima</option><option>Nara</option><option>Sapporo</option><option>Fukuoka</option></select></label><label for="chat-days">Days<input id="chat-days" type="number" min="1" max="30" value="7"></label><label for="chat-style">Travel style<select id="chat-style"><option>Balanced</option><option>Relaxed</option><option>Fast-paced</option><option>Food-focused</option><option>Culture & history</option><option>Family-friendly</option></select></label><label for="chat-budget">Budget<select id="chat-budget"><option>Mid-range</option><option>Budget</option><option>Comfortable</option><option>Luxury</option></select></label><p class="sub">You can change these at any time. The AI will use them in the next answer.</p></aside><section class="chat" aria-label="AI travel planner chat"><div class="chat-head"><strong>✦ Michi AI</strong><span id="chat-status">Ready to help</span></div><div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-relevant="additions"><div class="chat-msg ai">Hi! I’m your Japan trip guide. Tell me what you’re thinking about — even if you’re not sure yet.<small>Try asking: “Tokyo or Kyoto for 4 days?”</small></div></div><div class="chat-prompts" aria-label="Suggested questions"><button class="chat-prompt" type="button" data-prompt="Is Tokyo or Kyoto better for a first trip of 5 days? Give me your honest opinion.">Tokyo or Kyoto?</button><button class="chat-prompt" type="button" data-prompt="I love food. Which Japanese city should I prioritise and why?">Best city for food?</button><button class="chat-prompt" type="button" data-prompt="What would you skip on a first trip to Japan if I only had 7 days?">What should I skip?</button><button class="chat-prompt" type="button" data-prompt="Build me a realistic 7-day Japan itinerary, but explain the trade-offs behind your choices.">Build my trip</button></div><form class="chat-form" id="planner-chat-form"><textarea id="chat-input" rows="2" placeholder="Ask for advice, compare options, or tell me what you want from the trip…" aria-label="Message the AI trip planner"></textarea><button class="chat-send" type="submit">Send</button></form></section></div><div class="planner-connection-note" id="ai-connection-note">Michi AI connects securely through the site backend when configured. If the service is unavailable, the site will explain what to check. AI advice is not a booking confirmation; verify changing details with official providers.</div><div class="note planner-note">The AI can give opinions and planning guidance, but opening hours, transport disruptions, reservations and other changing details should be checked with official sources before travelling.</div><div id="planner-days" class="planner-days"></div></div>`}),
myjapan:()=>({t:'My Japan',h:`<div class="wrap page"><a class="crumb" href="#/">← Home</a><div class="title-row"><div><h1>My Japan</h1><p class="lead">Your personal trip dashboard. Saved places, route ideas and itinerary choices stay on this device.</p></div><div class="start-actions"><a class="secondary-btn" href="#/start">Start / reset trip</a><a class="primary-btn" href="#/today">Today mode →</a><button class="secondary-btn" type="button" id="clear-saved">Clear saved</button></div></div><section class="trip-dates"><h2>Trip dates</h2><p class="sub">Add your dates to turn Michi into a day-by-day travel companion.</p><div class="budget-grid"><label>Start date<input id="trip-start" type="date"></label><label>End date<input id="trip-end" type="date"></label></div><div id="trip-countdown" class="budget-total">Add your dates</div></section><div id="myjapan-content"></div><section><div class="section-head"><div><h2>Bookings organiser</h2><p class="sub">Keep your reservations in one place. These details are stored only in this browser on this device.</p></div><a class="crumb" href="#/stay-compare">Compare stays →</a></div><form id="booking-form" class="booking-form"><label>Booking type<select id="booking-type"><option>Accommodation</option><option>Flight</option><option>Train / rail pass</option><option>Attraction / activity</option><option>Restaurant</option><option>Other</option></select></label><label>City / area<input id="booking-city" placeholder="e.g. Kyoto"></label><label class="full">Provider or booking name<input id="booking-name" required placeholder="e.g. Hotel name or flight route"></label><label>Start / check-in date<input id="booking-start" type="date"></label><label>End / check-out date<input id="booking-end" type="date"></label><label>Estimated or paid total (¥)<input id="booking-cost" type="number" min="0" step="1" placeholder="Optional"></label><label>Status<select id="booking-status"><option>Considering</option><option>To book</option><option>Booked</option><option>Cancelled</option></select></label><label class="full">Booking link (optional)<input id="booking-link" type="url" placeholder="https://…"></label><label class="full">Notes (optional)<textarea id="booking-notes" rows="2" placeholder="Cancellation deadline, check-in time, baggage, etc. Do not store passwords or payment details."></textarea></label><div class="full"><button class="primary-btn" type="submit">Save booking</button></div></form><div id="booking-records" class="booking-records"></div><div id="saved-ai-plans"></div></section><section><h2>Trip budget</h2><p class="sub">A quick planning estimate — change the assumptions to suit your trip.</p><div class="budget-grid"><label>Travellers<input id="budget-people" type="number" min="1" value="2"></label><label>Nights<input id="budget-nights" type="number" min="1" value="7"></label><label>Hotel / night (¥)<input id="budget-hotel" type="number" min="0" value="18000"></label><label>Food / person / day (¥)<input id="budget-food" type="number" min="0" value="7000"></label><label>Transport / person / day (¥)<input id="budget-transport" type="number" min="0" value="2000"></label><label>Activities / person / day (¥)<input id="budget-activities" type="number" min="0" value="2500"></label></div><div class="budget-total" id="budget-total">¥0</div><p class="sub" id="budget-breakdown"></p></section><section><h2>Before you fly</h2><div class="checklist">${['Check passport and entry requirements','Book your first nights','Add saved places to an itinerary','Check major attraction reservations','Plan how you will get from the airport','Download offline maps / translation tools','Check weather for the cities on your route'].map((x,i)=>`<label><input type="checkbox" data-check="${i}"> <span>${x}</span></label>`).join('')}</div></section></div>`}),


'stay-compare':()=>({t:'Compare accommodation in Japan',h:`<div class="wrap page"><a class="crumb" href="#/stay-guide">← Accommodation guide</a><h1>Find the right place to stay</h1><p class="lead">Compare neighbourhood strategies and open current accommodation searches. Michi does not invent live hotel prices or availability; check final rates, taxes and cancellation terms on the booking site.</p><form id="stay-compare-form" class="stay-search-grid"><label>City<select id="stay-city"><option>Tokyo</option><option>Kyoto</option><option>Osaka</option><option>Hiroshima</option><option>Nara</option><option>Sapporo</option><option>Fukuoka</option></select></label><label>Stay type<select id="stay-type"><option value="any">Any type</option><option value="hotel">Hotel</option><option value="ryokan">Ryokan / traditional inn</option><option value="hostel">Hostel / guesthouse</option><option value="apartment">Apartment / family stay</option></select></label><label>Nightly budget per room (¥)<select id="stay-budget"><option value="10000">Up to ¥10,000</option><option value="18000" selected>Up to ¥18,000</option><option value="30000">Up to ¥30,000</option><option value="50000">¥30,000+</option></select></label><label>Guests<input id="stay-guests" type="number" min="1" max="12" value="2"></label><label>Nights<input id="stay-nights" type="number" min="1" max="60" value="3"></label><label>Check-in date<input id="stay-date" type="date"></label><div class="full"><button class="primary-btn" type="submit">Compare areas & booking options</button></div></form><div id="stay-compare-results" aria-live="polite"><p class="note">Choose your preferences and compare neighbourhoods before opening booking searches.</p></div><section><h2>Before you book</h2><div class="quick-grid"><article class="quick-card"><strong>Check the total</strong><span>Include taxes, service charges, breakfast and any cleaning fees.</span></article><article class="quick-card"><strong>Check the station</strong><span>Measure the walking route and confirm the station is useful for your itinerary.</span></article><article class="quick-card"><strong>Check cancellation</strong><span>Compare refundable and non-refundable rates and the local cancellation deadline.</span></article><article class="quick-card"><strong>Check the room</strong><span>Room size, bed setup, luggage space and bathroom type can vary considerably.</span></article></div></section><p class="sub">Prices and availability are supplied by the booking provider, not Michi. Always confirm property details, reviews, address and terms before paying.</p></div>`}),
'stay-guide':()=>({t:'Japan accommodation guide',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>Where to stay in Japan</h1><p class="lead">Choose accommodation around your itinerary and a convenient station, not just the lowest nightly price. Recommendations below are neighbourhood strategies, not endorsements of individual properties; rates and availability change.</p><div class="quick-grid"><article class="quick-card"><strong>Business hotels</strong><span>Reliable, compact rooms; often a strong value for couples or solo travellers.</span></article><article class="quick-card"><strong>Hostels & guesthouses</strong><span>Lower-cost stays and social spaces; check room type, shared bathrooms and quiet hours.</span></article><article class="quick-card"><strong>Ryokan</strong><span>Traditional inn experience, sometimes with meals and futon bedding; check meal times and bathing rules.</span></article><article class="quick-card"><strong>Apartment stays</strong><span>Useful for families or longer stays; verify legal registration, check-in instructions and house rules.</span></article></div>${[{n:'Tokyo',area:'Shinjuku for transport and nightlife; Ueno for museums and value; Tokyo Station/Ginza for central access; Shibuya for shopping and a lively base.',tip:'Tokyo is large. Pick a base near a station on the lines you expect to use most.'},{n:'Kyoto',area:'Kyoto Station for rail connections and luggage; downtown Kawaramachi/Sanjo for dining and central access; Higashiyama for atmosphere but often more crowds.',tip:'Buses can be crowded. A location near a train or subway station can make busy sightseeing days easier.'},{n:'Osaka',area:'Namba for food and nightlife; Umeda/Osaka Station for regional rail connections; Tennoji for another practical transport hub.',tip:'Choose based on whether your priority is evenings in Namba or day trips from major rail terminals.'},{n:'Hiroshima',area:'Near Hiroshima Station for onward rail travel; central Hondori/Paper Crane Park area for dining and sightseeing.',tip:'For Miyajima, compare the time to the JR or tram/ferry connections from your accommodation.'},{n:'Nara',area:'Near Kintetsu Nara for the park and central sights; near JR Nara if your route depends on JR trains.',tip:'Many visitors can day-trip from Kyoto or Osaka; stay overnight if you want a quieter evening or early start.'},{n:'Sapporo',area:'Odori/Susukino for central city access and dining; Sapporo Station for rail connections and luggage convenience.',tip:'Winter travel means snow and cold: value covered walkways and a short route from station to hotel.'},{n:'Fukuoka',area:'Hakata for rail and airport connections; Tenjin for shopping and restaurants; Nakasu for evening food spots.',tip:'Fukuoka Airport is close to the city centre, but check your flight terminal and route.'}].map(c=>`<section class="item"><h2>${c.n}</h2><p><strong>Where to look:</strong> ${c.area}</p><p><strong>Michi tip:</strong> ${c.tip}</p><p><a href="https://www.google.com/maps/search/hotels+in+${encodeURIComponent(c.n+' Japan')}" target="_blank" rel="noopener">Browse accommodation on Google Maps ↗</a> · <a href="https://www.booking.com/" target="_blank" rel="noopener">Booking.com ↗</a></p></section>`).join('')}<div class="note">Before booking, check cancellation terms, room size, bed configuration, station walking distance, luggage storage, check-in hours, taxes and whether breakfast is included. Book popular dates early.</div></div>`}),
'travel-guide':()=>({t:'Complete Japan travel guide',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>Your complete Japan travel guide</h1><p class="lead">A practical checklist for planning, arriving, getting around and handling everyday travel. Entry rules, timetables, fares and operating conditions can change, so confirm details with official sources before departure.</p><div class="quick-grid"><a class="quick-card" href="#/stay-guide"><strong>🛏 Accommodation</strong><span>Neighbourhoods, hotel types and booking checks</span></a><a class="quick-card" href="#/transport"><strong>🚄 Transport</strong><span>Rail, subway, buses, IC cards and passes</span></a><a class="quick-card" href="#/myjapan"><strong>✓ Trip checklist</strong><span>Keep trip tasks and your itinerary together</span></a><a class="quick-card" href="#/seasons"><strong>🌦 Seasons</strong><span>Plan around climate and crowds</span></a></div><section><h2>Before booking</h2>${[['Entry requirements','Check passport validity, visa/visa-waiver rules and current entry guidance for your nationality. Use the Japanese Ministry of Foreign Affairs and official Visit Japan Web information.'],['Flights and airports','Confirm which airport you arrive at and depart from. Tokyo has Haneda and Narita; the Osaka area is served by Kansai and Itami. Check the terminal before planning a transfer.'],['Accommodation','Book cancellable rooms when plans are uncertain. Check station access, luggage storage, check-in hours, bed sizes and cancellation rules.'],['Travel insurance','Choose cover that suits your activities, health needs, delays, theft and medical costs; read exclusions.'],['Connectivity','Compare an eSIM, physical SIM or pocket Wi-Fi. Install apps and download essential maps before leaving home.'],['Money and payments','Use a mix of card and cash. Notify your bank if needed and check overseas fees. Keep a backup payment method separate.'],['Packing and power','Japan uses Type A two-flat-pin plugs in most places; check device voltage and carry an appropriate adapter. Pack comfortable walking shoes and weather layers.']].map(x=>`<div class="item"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</section><section><h2>Getting around: what to use</h2><div class="transport-grid"><article><h3>City subway and trains</h3><p>Best for urban travel. Major cities have multiple operators, so check the line, direction, station exit and transfer route—not only the station name.</p></article><article><h3>IC travel card</h3><p>Suica, PASMO and ICOCA are common examples. Tap in and out where supported; keep a little cash for services that do not accept IC cards.</p></article><article><h3>Shinkansen</h3><p>Useful for longer intercity legs. Compare point-to-point tickets with regional or national passes based on your exact route and travel dates.</p></article><article><h3>Local and highway buses</h3><p>Important in places such as Kyoto and for some rural routes. Check boarding method, payment and luggage rules in advance.</p></article><article><h3>Taxis and rides</h3><p>Useful for late nights, heavy bags or routes with awkward transfers; cost rises quickly over longer distances.</p></article><article><h3>Luggage forwarding</h3><p>Consider sending large bags between hotels so you can travel more easily on trains. Confirm delivery timing and hotel acceptance before sending.</p></article></div><p>For route planning, fares and timetables, use <a href="https://world.jorudan.co.jp/mln/en/" target="_blank" rel="noopener">Japan Transit Planner ↗</a>, <a href="https://japantravel.navitime.com/en/" target="_blank" rel="noopener">NAVITIME ↗</a> and the official operator maps below.</p></section><section><h2>City subway and rail maps</h2><p class="sub">Use official maps for line colours, station names and current service information.</p><div class="grid"><a class="quick-card" href="https://www.tokyometro.jp/en/subwaymap/" target="_blank" rel="noopener"><strong>Tokyo Metro</strong><span>Tokyo Metro subway map ↗</span></a><a class="quick-card" href="https://www.kotsu.metro.tokyo.jp/eng/services/subway.html" target="_blank" rel="noopener"><strong>Toei Subway</strong><span>Tokyo's other major subway operator ↗</span></a><a class="quick-card" href="https://subway.osakametro.co.jp/en/guide/routemap.php" target="_blank" rel="noopener"><strong>Osaka Metro</strong><span>Osaka line map ↗</span></a><a class="quick-card" href="https://www2.city.kyoto.lg.jp/kotsu/webguide/en/" target="_blank" rel="noopener"><strong>Kyoto transport</strong><span>Subway, bus and city transport information ↗</span></a><a class="quick-card" href="https://www.jr-odekake.net/en/" target="_blank" rel="noopener"><strong>JR West</strong><span>Rail information for Kansai and western Japan ↗</span></a><a class="quick-card" href="https://www.jreast.co.jp/multi/en/" target="_blank" rel="noopener"><strong>JR East</strong><span>Rail information for Tokyo and eastern Japan ↗</span></a></div></section><section><h2>Everyday etiquette and safety</h2>${[['Trains','Keep phone calls quiet or take them off the train, avoid blocking doors, and move backpacks out of the way in crowds.'],['Restaurants','Check whether a shop uses ticket machines or cash-only payment. Tipping is generally not customary.'],['Temples and shrines','Follow signs, keep to marked paths, and observe any photography or worship guidance.'],['Onsen and baths','Check bathing rules, washing requirements, towel etiquette and any tattoo policy before entering.'],['Emergencies','Save your accommodation address and local emergency contacts. Japan Visitor Hotline and official emergency guidance are useful resources.'],['Accessibility','If you need step-free routes, check station elevator information and contact operators ahead of time for assistance.']].map(x=>`<div class="item"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</section><section><h2>Official planning resources</h2><ul><li><a href="https://www.japan.travel/en/" target="_blank" rel="noopener">Japan National Tourism Organization (JNTO) ↗</a> — destination and practical travel advice.</li><li><a href="https://www.mofa.go.jp/j_info/visit/visa/index.html" target="_blank" rel="noopener">Ministry of Foreign Affairs visa information ↗</a> — check requirements for your passport.</li><li><a href="https://www.vjw.digital.go.jp/" target="_blank" rel="noopener">Visit Japan Web ↗</a> — official online arrival procedures where applicable.</li><li><a href="https://www.japan.travel/en/plan/" target="_blank" rel="noopener">JNTO trip planning ↗</a> — connectivity, money, climate and practical basics.</li></ul></section><div class="note">This guide is a starting point, not a substitute for official immigration, medical or transport updates. Check live information close to travel and on the day.</div></div>`}),
'essentials':()=>({t:'Japan trip checklist',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>Your Japan trip checklist</h1><p class="lead">A practical, save-as-you-go checklist. Tick items as you complete them; progress is saved in this browser on this device.</p><div class="quick-grid"><a class="quick-card" href="#/travel-guide"><strong>Before you go</strong><span>Entry requirements, insurance, flights and connectivity</span></a><a class="quick-card" href="#/stay-guide"><strong>Where to stay</strong><span>Choose areas and check booking details</span></a><a class="quick-card" href="#/transport"><strong>Getting around</strong><span>Rail, IC cards and airport transfers</span></a></div><div class="item"><div class="section-head"><h2>Before booking</h2><span id="check-progress-a" class="sub"></span></div>${[['passport','Check passport validity and entry rules for your nationality'],['dates','Confirm dates, arrival airport and departure airport'],['flights','Book flights and save booking references'],['insurance','Arrange suitable travel insurance'],['budget','Set a realistic daily and total budget'],['route','Choose cities and avoid unnecessary hotel changes']].map(x=>`<label class="platform-check"><input type="checkbox" data-platform-check="${x[0]}"> <span>${x[1]}</span></label>`).join('')}</div><div class="item"><div class="section-head"><h2>Bookings and preparation</h2><span id="check-progress-b" class="sub"></span></div>${[['stay','Book accommodation and verify cancellation terms'],['rail','Compare point-to-point fares and passes for your actual route'],['connect','Arrange an eSIM, SIM or pocket Wi-Fi'],['payments','Check overseas card fees and prepare a backup payment method'],['apps','Install maps and transit apps; download offline essentials'],['documents','Keep copies of bookings, insurance and passport details securely']].map(x=>`<label class="platform-check"><input type="checkbox" data-platform-check="${x[0]}"> <span>${x[1]}</span></label>`).join('')}</div><div class="item"><div class="section-head"><h2>Arrival and daily travel</h2><span id="check-progress-c" class="sub"></span></div>${[['arrival','Check Visit Japan Web and current arrival procedures'],['airport','Plan the airport-to-hotel journey'],['iccard','Set up or buy a suitable IC travel card if useful'],['cash','Carry a little cash and a backup payment option'],['luggage','Check luggage forwarding rules and delivery timing'],['emergency','Save accommodation address and emergency numbers']].map(x=>`<label class="platform-check"><input type="checkbox" data-platform-check="${x[0]}"> <span>${x[1]}</span></label>`).join('')}</div><button type="button" class="secondary-btn" id="reset-platform-checks">Reset checklist</button><p class="sub">This checklist is stored locally in your browser. It is not synced between devices or shared with other travellers.</p></div>`}),
'phrasebook':()=>({t:'Japanese travel phrasebook',h:`<div class="wrap page"><a class="crumb" href="#/tools">← Trip tools</a><h1>Japanese travel phrasebook</h1><p class="lead">A small practical phrasebook for stations, restaurants, shops and asking for help. Select Copy to copy a phrase to your clipboard.</p><div class="filter-pills" aria-label="Phrase categories"><button type="button" class="pill phrase-filter" data-phrase-filter="all">All phrases</button><button type="button" class="pill phrase-filter" data-phrase-filter="polite">Polite basics</button><button type="button" class="pill phrase-filter" data-phrase-filter="food">Food</button><button type="button" class="pill phrase-filter" data-phrase-filter="transport">Transport</button><button type="button" class="pill phrase-filter" data-phrase-filter="help">Help</button></div><div id="phrasebook-list" class="item-list">${[['polite','こんにちは','Konnichiwa','Hello'],['polite','ありがとうございます','Arigatō gozaimasu','Thank you very much'],['polite','すみません','Sumimasen','Excuse me / sorry'],['polite','お願いします','Onegaishimasu','Please / I would appreciate it'],['food','メニューをお願いします','Menyū o onegaishimasu','Menu, please'],['food','これは何ですか？','Kore wa nan desu ka?','What is this?'],['food','アレルギーがあります','Arerugī ga arimasu','I have an allergy'],['food','お会計をお願いします','Okaikei o onegaishimasu','The bill, please'],['transport','駅はどこですか？','Eki wa doko desu ka?','Where is the station?'],['transport','この電車は東京に行きますか？','Kono densha wa Tōkyō ni ikimasu ka?','Does this train go to Tokyo?'],['transport','切符はどこで買えますか？','Kippu wa doko de kaemasu ka?','Where can I buy a ticket?'],['help','英語を話せますか？','Eigo o hanasemasu ka?','Can you speak English?'],['help','助けてください','Tasukete kudasai','Please help me'],['help','病院はどこですか？','Byōin wa doko desu ka?','Where is the hospital?']].map(x=>`<article class="item phrase-card" data-phrase-category="${x[0]}"><div class="section-head"><div><h2>${x[1]}</h2><p><em>${x[2]}</em></p><p>${x[3]}</p></div><button class="secondary-btn copy-phrase" type="button" data-copy-phrase="${x[1]} — ${x[2]} — ${x[3]}">Copy</button></div></article>`).join('')}</div><div id="phrasebook-status" class="sub" role="status" aria-live="polite"></div><div class="note">Pronunciation is approximate, and Japanese politeness depends on context. For allergies, show the written phrase and confirm ingredients carefully; do not rely on a phrase alone for serious allergies.</div></div>`}),
'rail-pass':()=>({t:'Japan rail pass guide',h:`<div class="wrap page"><a class="crumb" href="#/transport">← Transport guide</a><h1>Should you buy a rail pass?</h1><p class="lead">Do not assume a nationwide pass saves money. Compare the routes you will actually take, dates, seat preferences and any regional passes before buying.</p><div class="item"><h2>Quick route check</h2><p>Choose the travel pattern closest to your plan for a starting recommendation.</p><label class="route-mode">Main travel pattern<select id="rail-pattern"><option value="city">Mostly one city with local trains and subway</option><option value="classic">Tokyo → Kyoto/Osaka → Tokyo</option><option value="west">Kansai plus Hiroshima / western Japan</option><option value="multi">Several long-distance Shinkansen journeys</option><option value="north">Tokyo plus Tohoku or Hokkaido</option></select></label><label class="route-mode">How many long-distance train days?<select id="rail-days"><option value="0">0–1 days</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4–5 days</option><option value="6">6+ days</option></select></label><button class="primary-btn" type="button" id="rail-advice-button">Show what to compare</button><div class="season-result" id="rail-advice" aria-live="polite">Choose your pattern and travel days to see a starting point.</div></div><section><h2>What to compare</h2><div class="transport-grid"><article><h3>Nationwide JR Pass</h3><p>Compare its current price with eligible rail journeys you will actually use. It may not cover every private railway, subway or service in your itinerary.</p></article><article><h3>Regional passes</h3><p>Useful to compare when most long-distance travel stays within one region. Check coverage, eligibility, validity dates and reservation rules.</p></article><article><h3>Individual tickets</h3><p>Often worth comparing for a short route or a trip with only one or two long-distance journeys.</p></article><article><h3>IC cards</h3><p>Best treated as a local transit payment option, not a substitute for long-distance tickets or a rail pass.</p></article></div><p>Official starting points: <a href="https://japanrailpass.net/en/" target="_blank" rel="noopener">Japan Rail Pass official site ↗</a> · <a href="https://www.jr-odekake.net/en/" target="_blank" rel="noopener">JR West ↗</a> · <a href="https://www.jreast.co.jp/multi/en/" target="_blank" rel="noopener">JR East ↗</a> · <a href="https://japantravel.navitime.com/en/" target="_blank" rel="noopener">NAVITIME route planner ↗</a></p></section><div class="note">This is a comparison guide, not a live fare calculator. Prices, pass coverage and eligibility can change. Check official prices and current route fares before purchasing.</div></div>`}),
'safety':()=>({t:'Safety and emergency guide',h:`<div class="wrap page"><a class="crumb" href="#/travel-guide">← Travel guide</a><h1>Safety & emergencies in Japan</h1><p class="lead">Save essential information before you travel. In an immediate emergency, use local emergency services and follow instructions from authorities.</p><div class="quick-grid"><article class="quick-card"><strong>110 — Police</strong><span>For crimes, threats or urgent police assistance.</span></article><article class="quick-card"><strong>119 — Ambulance / Fire</strong><span>For urgent medical emergencies or fire.</span></article><article class="quick-card"><strong>Japan Visitor Hotline</strong><span>Check the current official number, hours and supported languages on the JNTO site before travel.</span></article></div><section><h2>Before you go</h2>${[['Save your address','Keep your hotel name, full address and phone number in Japanese if possible. Keep it accessible offline.'],['Medical needs','Carry essential medication in original packaging where possible, check import rules for your medicines and keep a note of allergies or conditions.'],['Natural hazards','Japan can experience earthquakes, typhoons, heavy rain and volcanic activity. Learn local evacuation signage and follow official alerts.'],['Lost passport','Contact your country’s embassy or consulate and follow its replacement-document process. Keep a secure copy of passport details separate from the original.'],['Lost property','Ask station staff, the venue or a koban (police box) for help. Note where and when you last had the item.'],['Travel insurance','Keep the insurer’s emergency number and policy details available offline; understand payment and claim requirements.']].map(x=>`<article class="item"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</section><section><h2>Useful official resources</h2><ul><li><a href="https://www.japan.travel/en/plan/emergency/" target="_blank" rel="noopener">JNTO emergency information ↗</a></li><li><a href="https://www.jnto.go.jp/emergency/eng/" target="_blank" rel="noopener">Japan National Tourism Organization emergency guide ↗</a></li><li><a href="https://www.jma.go.jp/jma/indexe.html" target="_blank" rel="noopener">Japan Meteorological Agency ↗</a> — weather and hazard information.</li></ul></section><div class="note">Emergency guidance can change. Confirm official contact details and local instructions before departure; this page is a travel aid, not an emergency dispatch service.</div></div>`}),

function bindToday(){const box=document.getElementById('today-content');if(!box)return;const saved=getSaved(),plan=getItinerary();let dates={};try{dates=JSON.parse(localStorage.getItem('michi-trip-dates')||'{}')}catch(e){}const start=dates.start?new Date(dates.start+'T00:00:00'):null,end=dates.end?new Date(dates.end+'T00:00:00'):null;const now=new Date();let day=0;if(start){day=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/86400000);if(day<0)day=0}const ids=plan[day]||[];box.innerHTML=`<section><div class="section-head"><div><h2>${start&&end&&now>=start&&now<=end?'Today’s plan':'Your next planned day'}</h2><p class="sub">Day ${day+1}${start&&end?` of ${Math.max(1,Math.round((end-start)/86400000)+1)}`:''}</p></div><a class="secondary-btn" href="#/myjapan">Edit itinerary</a></div><div class="saved-grid">${ids.map(id=>saved.find(x=>x.id===id)).filter(Boolean).map((x,i)=>`<article class="saved-card"><div><h3>${i+1}. ${esc(x.name)}</h3><small>${cityFromSaved(x)||'Japan'}</small></div><a class="mini-btn" href="${esc(x.url)}">Open</a></article>`).join('')||'<p class="sub">Nothing is planned for this day yet. Add saved places to your itinerary.</p>'}</div></section>`}
function bindConnection(){const b=document.getElementById('connection-status');if(!b)return;const update=()=>{b.hidden=navigator.onLine;b.textContent=navigator.onLine?'':'You are offline. Saved places, your itinerary and the core site still work; live maps, photos and AI may not.'};addEventListener('online',update);addEventListener('offline',update);update()}
bindConnection();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
function bindInstall(){const b=document.getElementById('install-app');if(!b)return;let deferred=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;b.hidden=false});b.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;b.hidden=true};addEventListener('appinstalled',()=>{b.hidden=true})}
function bindToolPages(){
 const seasonText={spring:'Spring is best if blossoms are your priority, but peak dates are busy. Summer is warm and humid in much of the country.',summer:'Summer is hot and humid in many cities, but it can be excellent for festivals and northern Japan. Build in shade and slower afternoons.',autumn:'Autumn is one of the easiest all-round seasons: comfortable walking weather, strong scenery and good conditions for city-hopping.',winter:'Winter is excellent for snow, onsens and crisp city days. Hokkaido and the mountains are dramatically colder than Tokyo or Kyoto.'};
 document.querySelectorAll('[data-season-page]').forEach(b=>b.onclick=()=>{const el=document.getElementById('season-page-result');if(el)el.textContent=seasonText[b.dataset.season]});
}

function bindPlatformWidgets(){
 const checks=[...document.querySelectorAll('[data-platform-check]')];
 if(checks.length){let state={};try{state=JSON.parse(localStorage.getItem('michi-platform-checks')||'{}')}catch(e){};const groups=[['passport','dates','flights','insurance','budget','route'],['stay','rail','connect','payments','apps','documents'],['arrival','airport','iccard','cash','luggage','emergency']];checks.forEach(el=>{el.checked=!!state[el.dataset.platformCheck];el.addEventListener('change',()=>{state[el.dataset.platformCheck]=el.checked;try{localStorage.setItem('michi-platform-checks',JSON.stringify(state))}catch(e){};updateProgress()})});function updateProgress(){groups.forEach((g,i)=>{const done=g.filter(k=>state[k]).length;const el=document.getElementById(['check-progress-a','check-progress-b','check-progress-c'][i]);if(el)el.textContent=`${done} of ${g.length} complete`})};updateProgress();document.getElementById('reset-platform-checks')?.addEventListener('click',()=>{if(confirm('Reset all checklist items?')){state={};try{localStorage.removeItem('michi-platform-checks')}catch(e){};checks.forEach(el=>el.checked=false);updateProgress()}})}
 document.querySelectorAll('.phrase-filter').forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.phraseFilter;document.querySelectorAll('.phrase-card').forEach(c=>c.hidden=f!=='all'&&c.dataset.phraseCategory!==f);document.querySelectorAll('.phrase-filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
 document.querySelectorAll('.copy-phrase').forEach(b=>b.addEventListener('click',async()=>{const txt=b.dataset.copyPhrase||'';const status=document.getElementById('phrasebook-status');try{await navigator.clipboard.writeText(txt);if(status)status.textContent='Copied phrase to clipboard.'}catch(e){if(status)status.textContent='Clipboard access was blocked. Select and copy this phrase manually: '+txt} }));
 document.getElementById('rail-advice-button')?.addEventListener('click',()=>{const p=document.getElementById('rail-pattern')?.value,d=Number(document.getElementById('rail-days')?.value||0),out=document.getElementById('rail-advice');if(!out)return;let msg='Compare individual tickets with the relevant regional pass, and use an IC card for local travel where accepted.';if(p==='city')msg='A nationwide rail pass is unlikely to be useful for mostly local subway and city travel. Compare individual local fares and an IC card; consider a local day pass only if its coverage fits your exact plan.';else if(p==='classic')msg='Compare the current nationwide pass price with the exact Tokyo–Kansai return journeys and any other eligible JR rides. Also compare individual tickets and any regional options; do not assume the pass wins.';else if(p==='west')msg='Compare a Kansai / western Japan regional pass against your exact Kyoto, Osaka, Hiroshima and other eligible rail legs. Verify whether your intended trains and seat reservations are included.';else if(p==='multi')msg='Multiple long-distance train days make pass comparison worthwhile. List every intercity leg and date, then compare eligible ticket totals with nationwide and regional pass prices.';else if(p==='north')msg='Compare the exact northern route legs with current JR East / Hokkaido options and individual tickets. Coverage, reserved-seat rules and service types matter.';if(d<=1)msg+=' With only 0–1 long-distance train days, individual tickets are especially important to compare.';else if(d>=4)msg+=' With several long-distance travel days, a pass comparison is worthwhile—but check actual coverage and current prices.';out.textContent=msg});
 const stayForm=document.getElementById('stay-compare-form');if(stayForm){const renderStay=()=>{const city=document.getElementById('stay-city').value,type=document.getElementById('stay-type').value,budget=Number(document.getElementById('stay-budget').value),guests=Math.max(1,Number(document.getElementById('stay-guests').value||2)),nights=Math.max(1,Number(document.getElementById('stay-nights').value||3)),date=document.getElementById('stay-date').value;const areas={Tokyo:[['Ueno','Practical for museums, rail links and often a more value-focused base.'],['Shinjuku','Excellent connections and nightlife; busy and spread out.'],['Tokyo Station / Ginza','Convenient for Shinkansen and central access; can cost more.']],Kyoto:[['Kyoto Station','Convenient with luggage and for regional trains.'],['Kawaramachi / Sanjo','Central dining and walkable evening options.'],['Higashiyama','Atmospheric historic streets; expect crowds and check transit access.']],Osaka:[['Namba','Food, shopping and nightlife.'],['Umeda / Osaka Station','Strong regional rail connections.'],['Tennoji','A practical transport hub with a different pace.']],Hiroshima:[['Hiroshima Station','Useful for rail arrivals and onward trips.'],['Hondori / Peace Park area','Central for dining and key city sights.']],Nara:[['Kintetsu Nara','Convenient for the park and central sights.'],['JR Nara','Useful when your route relies on JR connections.']],Sapporo:[['Odori','Central location for city sightseeing.'],['Sapporo Station','Convenient for rail connections and luggage.'],['Susukino','Dining and evening activity.']],Fukuoka:[['Hakata','Rail and airport connections.'],['Tenjin','Shopping, cafés and restaurants.'],['Nakasu','Evening food and riverside atmosphere.']]};const qs=encodeURIComponent(city+' Japan '+type+' accommodation '+guests+' guests '+(date?'check in '+date:''));const choices=areas[city]||[];const out=document.getElementById('stay-compare-results');out.innerHTML=`<div class="section-head"><div><h2>Suggested areas in ${city}</h2><p class="sub">Planning estimate: ${nights} night${nights===1?'':'s'} · up to ¥${budget.toLocaleString('en-US')} per room per night · ${guests} guest${guests===1?'':'s'} · ${type==='any'?'any stay type':type}</p></div></div><div class="stay-results">${choices.map((a,i)=>`<article class="stay-result"><h3>${a[0]}</h3><p>${a[1]}</p><p class="sub">Budget guide for your stay: up to ¥${(budget*nights).toLocaleString('en-US')} total before taxes and fees, if the nightly target is met. This is your budget target, not a live quote.</p><div class="stay-links"><a class="secondary-btn" target="_blank" rel="noopener" href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(a[0]+' '+city+' Japan')}&group_adults=${guests}&no_rooms=1${date?'&checkin='+encodeURIComponent(date):''}">Search stays ↗</a><a class="mini-btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/hotels+${encodeURIComponent(a[0]+' '+city+' Japan')}">Map & reviews ↗</a></div></article>`).join('')}</div><p class="note">Compare exact dates and room configuration on the provider website. Michi does not receive live booking inventory or verify a property’s current rate.</p>`};stayForm.addEventListener('submit',e=>{e.preventDefault();renderStay()});renderStay()}
 const bookingForm=document.getElementById('booking-form');if(bookingForm){const readBookings=()=>{try{return JSON.parse(localStorage.getItem('michi-bookings')||'[]')}catch(e){return[]}};const renderBookings=()=>{const list=readBookings(),out=document.getElementById('booking-records');out.innerHTML=list.length?list.map(b=>`<article class="booking-record"><div><h3>${esc(b.name)}</h3><p>${esc(b.type)} · ${esc(b.city||'Japan')} · <strong>${esc(b.status)}</strong></p><p class="sub">${esc(b.start||'Date not set')}${b.end?' → '+esc(b.end):''}${b.cost?' · ¥'+Number(b.cost).toLocaleString('en-US'):''}</p>${b.notes?`<p>${esc(b.notes)}</p>`:''}${b.url?`<p><a href="${esc(b.url)}" target="_blank" rel="noopener">Open booking ↗</a></p>`:''}</div><button type="button" class="mini-btn" data-delete-booking="${esc(b.id)}">Remove</button></article>`).join(''):'<p class="saved-empty">No bookings saved yet. Add a flight, stay, ticket or restaurant reservation above.</p>';out.querySelectorAll('[data-delete-booking]').forEach(btn=>btn.addEventListener('click',()=>{try{localStorage.setItem('michi-bookings',JSON.stringify(readBookings().filter(b=>b.id!==btn.dataset.deleteBooking)))}catch(e){}renderBookings()}));};bookingForm.addEventListener('submit',e=>{e.preventDefault();const get=id=>document.getElementById(id).value.trim();const name=get('booking-name');if(!name)return;let url=get('booking-link');if(url&&!/^https?:\/\//i.test(url)){alert('Please enter a full http or https booking link.');return}const b={id:String(Date.now()),type:get('booking-type'),city:get('booking-city'),name,start:get('booking-start'),end:get('booking-end'),cost:get('booking-cost'),status:get('booking-status'),url,notes:get('booking-notes')};try{const list=readBookings();list.unshift(b);localStorage.setItem('michi-bookings',JSON.stringify(list.slice(0,100)));bookingForm.reset();renderBookings()}catch(err){alert('Could not save booking on this device. Check available browser storage.')}});renderBookings();const notesOut=document.getElementById('saved-ai-plans');let notes=[];try{notes=JSON.parse(localStorage.getItem('michi-trip-notes')||'[]')}catch(e){}notesOut.innerHTML=notes.length?`<section><h2>Saved Michi AI notes</h2>${notes.map(n=>`<article class="item"><div class="section-head"><div><h3>${esc(n.title||'Trip note')}</h3><p class="sub">Saved ${esc((n.savedAt||'').slice(0,10))}</p></div><button class="mini-btn" type="button" data-delete-note="${esc(n.id)}">Remove</button></div><p>${esc(n.text).replace(/\n/g,'<br>')}</p></article>`).join('')}</section>`:'';notesOut.querySelectorAll('[data-delete-note]').forEach(btn=>btn.addEventListener('click',()=>{try{localStorage.setItem('michi-trip-notes',JSON.stringify(notes.filter(n=>String(n.id)!==btn.dataset.deleteNote)))}catch(e){}btn.closest('.item').remove()}))}
}

function route(){
 const id=location.hash.replace('#/','').trim();
 const m=id.match(/^([a-z]+)\/(\d+)$/);const m2=id.match(/^([a-z]+)\/(skyline|street|food|plan)$/);const m3=id.match(/^([a-z]+)\/eat\/(\d+)$/);const m4=id.match(/^([a-z]+)\/food\/([a-z0-9-]+)$/);const p=m4?foodTypePage(m4[1],m4[2]):m?placePage(m[1],+m[2]):m3?eatPage(m3[1],+m3[2]):m2?themePage(m2[1],m2[2]):(PAGES[id]||PAGES[''])();
 document.title=p.t+(id?' — Michi':'');
 document.getElementById('app').innerHTML=p.h;bindSearch();bindPlanner();bindStart();bindSaved();bindMyJapan();bindToday();bindInstall();bindToolPages();bindPlatformWidgets();if(document.querySelector('.city-map'))loadLeaflet();
 window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
